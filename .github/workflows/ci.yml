name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build
        env:
          VITE_APP_VERSION: "ci-build"
          VITE_APP_BUILD_NUMBER: "ci"

  rust-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check -p snotra-core -p snotra

      - name: cargo test (snotra-core)
        run: cargo test -p snotra-core

      - name: cargo clippy
        run: cargo clippy -p snotra-core -p snotra -- -D warnings
