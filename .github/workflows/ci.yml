name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 旧 frontend-check の縮退（#532 SU7 PR3・フロント撤去）。残る npm test は
  # セーフティネット（.claude/hooks・.githooks・scripts）の vitest で、ubuntu 側は
  # 実行ビット・POSIX sh 厳密性を rust-check（windows）と相補的に担保する（#509）。
  node-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run tests (vitest: .claude/hooks + .githooks + scripts)"
        run: npm test

  # #587: ガバナンス文書の決定的検査。skip-ci ガードを意図的に付けない —
  # skip-safe と定義された変更（docs/rules/skills/*.md）こそが本検査の対象であり、
  # ガードを付けると Markdown-only PR が再び未検査に戻る。paths フィルタも付けない
  # （依存ゼロ・数秒で完了するため常時実行し、「走らなかった」経路を作らない）。
  governance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: governance check
        run: node scripts/governance-check.mjs

  rust-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **この job が使う component はすべて明示する**。この action は
      # `rustup toolchain install <toolchain> ... --profile minimal` を実行しており、
      # minimal プロファイルは rustfmt も clippy も含まない（action.yml で確認・#858）。
      # 明示しなくても動いていたのは runner イメージにプリインストールされた toolchain の
      # おかげ（rustup は既存 toolchain の component を削らない）であって、action の保証ではない。
      # **この依存は runner イメージが Rust のプリインストールをやめた日に初めて壊れる**——
      # それまで一切の兆候が出ない種類の依存なので、使う側で名指ししておく（#858 で rustfmt、#859 で clippy）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # #858: 整形ゲート。**ビルドを要さない（0.7s）ので最初に置く**——他の検査が
      # 数十秒かけて通った後に整形だけで落ちる、という待ち方をさせない。
      # このリポジトリの様式は初期コミットから rustfmt 既定であり（drift 0 を実測）、
      # 2026-02〜04 に習慣が途切れて 460 ハンクまで積み上がった。**人ではなく機構が持つ**
      # ことが本検査の目的であり、マシンが変わっても途切れないのはそのためである。
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `save-if` で main からしか保存しない。**この job 単体の都合ではなく、Actions キャッシュの
      # 10GB 上限を共有しているからである**——保存を許すと PR ごとに 2573MB が
      # `refs/pull/*/merge` へ積まれ（実測）、e2e.yml が main スコープへ置く smoke 用の
      # エントリを LRU で押し出しうる。**押し出されても赤くならない**（restore-key で部分ヒットし、
      # ビルドが静かに元の所要へ戻る）ため、検出ではなく圧力そのものを断つ。
      #
      # 受容する残余: Cargo.lock を変える PR では、その PR の 2 回目以降の run も main の
      # エントリからしか復元できない。rust-check は debug ビルドで元々短く（実測 4m18s）、
      # 依存を動かす PR は稀（`/deps-update`）なので、常時かかる 10GB 圧力と釣り合わない。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (snotra-core)
        run: cargo test -p snotra-core

      - name: cargo test (snotra-egui-runtime)
        run: cargo test -p snotra-egui-runtime

      - name: cargo test (snotra)
        run: cargo test -p snotra

      - name: cargo test (snotra-settings)
        run: cargo test -p snotra-settings

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Pester の統合テストが、共有モジュールで作った seed を実際の製品が parse できることと、
      # Win32/DWM の窓矩形とキャプチャ寸法が一致することを検査する。
      - name: cargo build (PowerShell integration fixture)
        run: cargo build -p snotra

      # #562: docgen 検出器。doc コメント内の intra-doc link（散文内シンボル参照）の切れを
      # 機械検査する。deny 化は各 crate の `[lints] workspace = true`（Cargo.toml）経由で、
      # 既定 warn の素通りを塞ぐ。--document-private-items は private モジュールの //! link も
      # 検査対象にするため必須。src-tauri は windows 専用依存ゆえ ubuntu では build 不能＝
      # この windows ジョブで走らせる。
      - name: cargo doc (intra-doc link check)
        run: cargo doc --workspace --no-deps --document-private-items

      # #509: main 保護 Layer 1（.githooks）と PreToolUse/PostToolUse フック
      # （.claude/hooks）の selftest は、実運用が Windows でのみ起きるセーフティネット。
      # ubuntu の node-check と相補的に、Windows 固有の hook 実行機構
      # （Git-for-Windows の shebang 経由 sh 起動・パス/クォート境界）を検知する。
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run tests on Windows (vitest: .claude/hooks + .githooks + scripts)"
        run: npm test

      - name: "Run PowerShell tests (Pester)"
        run: npm run test:powershell
