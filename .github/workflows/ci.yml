name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  # **main ではキャンセルしない**。下の rust-check へ `save-if` を入れて main を唯一の保存経路に
  # したため、main の run がキャンセルされると保存の Post ステップまで到達する保証が無くなる
  # （到達しないと確かめたわけではない。保証が無い側へ倒すのが安全側である）。main へは直近
  # 14 日で 184 コミット（1 日平均 13）入っており、連続マージが同じ `group` を奪い合う頻度に
  # 達している。**e2e.yml が同じ理由で同じ形を採る**——保存経路を絞ったなら、その経路を
  # キャンセルしない。PR 側は従来どおり最新だけを残す。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 旧 frontend-check の縮退（#532 SU7 PR3・フロント撤去）。残る npm test は
  # セーフティネット（.claude/hooks・.githooks・scripts）の vitest で、ubuntu 側は
  # 実行ビット・POSIX sh 厳密性を rust-check（windows）と相補的に担保する（#509）。
  node-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run tests (vitest: .claude/hooks + .githooks + scripts)"
        run: npm test

  # #587: ガバナンス文書の決定的検査。skip-ci ガードを意図的に付けない —
  # skip-safe と定義された変更（docs/rules/skills/*.md）こそが本検査の対象であり、
  # ガードを付けると Markdown-only PR が再び未検査に戻る。paths フィルタも付けない
  # （`governance check` step は依存ゼロ・数秒で完了するため常時実行し、「走らなかった」
  # 経路を作らない）。**#1088 の `governance manifest delta` step はこの前提の外にある**——
  # ネットワークと GitHub API に依存し、skip-ci ガードも無い。この step の一時的な失敗は
  # Markdown-only PR も含め全 PR を赤くする——受容する残余とする（速さの理由は変わらず有効）。
  # **同 step は `if: github.event_name == 'pull_request'` を持ち、push（main への直接反映時）
  # では走らない**——これも「走らなかった」経路の一種だが、比較対象の base も宣言先の PR 本文も
  # push には存在せず比較が意味を持たないため許容する。`governance check` step は job 全体として
  # push でも走るので、常時実行の原則はそちらで保たれる。
  governance-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: governance check
        run: node scripts/governance-check.mjs

      # #1088: 構造母集団（検査・対象文書・rules・skills）の集合を **この PR の base** と比べ、
      # 差分が在るのに PR 本文で宣言されていなければ落とす。散文母集団（見出し参照・文字数）は
      # 変動が多すぎて承認がゴム印化するので対象にしない（実測は
      # docs/superpowers/specs/2026-08-14-governance-check-scope-design.md）。
      #
      # **base は `pull_request.base.sha` である——実行時の `origin/main` ではない。**
      # checkout される merge commit は event payload に凍結されており、base だけを実行時の
      # main tip から取ると、event 発火と job 実行の間に main が動いた分が**この PR の delta として
      # 現れる**。他人が足した rules の「削除」を無関係な PR の作者が宣言する羽目になり、
      # ゴム印を防ぐための機構が自らゴム印を要求する。base も payload 側で凍結する——ただし
      # `base.sha` は event 組み立て時点の base branch tip であり、実際の merge ref の親コミットとは
      # 秒単位の窓でずれうる（凍結後は動かない）。「同一コミット」ではなく**「同じ event で凍結
      # される」という意味で対称**にする。
      #
      # **可変なのは PR 本文だけでよい。** `github.event.pull_request.body` は payload に凍結
      # されており、`pull_request` の既定 types に `edited` は無く、再実行は同じ payload を再生する。
      # 凍結値では「本文へ宣言を書いて再実行する」という復帰手順が成立しない。base と head は
      # 凍結、本文は都度取得——この非対称が意図である。
      #
      # **skip は「base 側にスクリプトが無い」ときだけである。** base が解決できなければ
      # `set -e` 下で fetch がそこで落ちる（skip へは落ちない。後段の `rev-parse` は 2 枚目の網。
      # `git fetch --depth=1 origin "$BASE_SHA"` は bare SHA を fetch するため local ref を作らず
      # `FETCH_HEAD` にしか残らない——後続はすべて `$BASE_SHA` を直接参照するため実害は無いが、
      # ref 名を前提にする行を足すときは要注意）。**この分岐は恒久的なものであって、導入 PR 用の
      # 足場ではない**——`base.sha` は event 発火時点の base tip なので、この機構がマージされた後も
      # **それより前に base が凍結された open PR** は base にスクリプトを持たない。比べる相手が無い
      # のだから飛ばすのが正しく、`exit 1` へ倒すとそれらの PR を巻き添えに落とす。
      # 残余: base からスクリプトが消えると以後は沈黙する。ただしそこへ至る PR は head 側の
      # `node "$GOV_MANIFEST"` が落ちて赤くなる（下の単一情報源化がこれを担保する）ので、
      # 赤を承知でマージした場合に限られる。
      #
      # **スクリプトのパスは 1 か所にする。** probe（base 側）と呼び出し（head 側）に literal を
      # 2 つ持つと、改名で片方だけ直したとき probe が恒久的に外れ、head 側は動くので**赤い run を
      # 一度も経ずに**沈黙の緑へ入る。`GOV_MANIFEST` を単一の情報源にすれば、直し忘れは head 側の
      # 呼び出しが落ちて鳴る。
      - name: governance manifest delta
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GOV_MANIFEST: scripts/governance-manifest.mjs
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
          if git cat-file -e "$BASE_SHA:$GOV_MANIFEST" 2>/dev/null; then
            git worktree add --detach /tmp/gov-base "$BASE_SHA"
            (cd /tmp/gov-base && node "$GOV_MANIFEST") > /tmp/base.json
            PR_BODY="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
            export PR_BODY
            node "$GOV_MANIFEST" --compare /tmp/base.json
          else
            echo "governance manifest — base 側に $GOV_MANIFEST が無いので比較を飛ばす（base がこの機構の導入より前に凍結された PR）"
          fi

  rust-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **実際に検査が使う版を決めるのはここではなく `rust-toolchain.toml` である**（#1161）。
      # この action は toml を一切参照しない（`toolchain` は required・`rustup toolchain install`
      # と `rustup default` を実行するだけ。action.yml で確認）が、cargo は rustup shim 越しに
      # toml を読んで override する。ゆえにここが入れる stable は**使われない**。
      # **それでも `@stable` を残すのは、この step が rustup と cargo を runner へ用意する
      # 役目に変わったからである**——外すと下の「プリインストールに暗黙依存する」形そのものになる。
      # 版を toml と揃えて書くことはしない（同じ値が 2 か所になり、片方だけ直す形が作れる）。
      #
      # **この job が使う component はすべて明示する**。この action は
      # `rustup toolchain install <toolchain> ... --profile minimal` を実行しており、
      # minimal プロファイルは rustfmt も clippy も含まない（action.yml で確認・#858）。
      # 明示しなくても動いていたのは runner イメージにプリインストールされた toolchain の
      # おかげ（rustup は既存 toolchain の component を削らない）であって、action の保証ではない。
      # **この依存は runner イメージが Rust のプリインストールをやめた日に初めて壊れる**——
      # それまで一切の兆候が出ない種類の依存なので、使う側で名指ししておく（#858 で rustfmt、#859 で clippy）。
      # **同じ要求は toml 側にもある**——override 後に実際に走る toolchain の component は
      # `rust-toolchain.toml` の `components` が決める（そちらが正本・2026-08-21 実測）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # #858: 整形ゲート。**ビルドを要さない（0.7s）ので最初に置く**——他の検査が
      # 数十秒かけて通った後に整形だけで落ちる、という待ち方をさせない。
      # このリポジトリの様式は初期コミットから rustfmt 既定であり（drift 0 を実測）、
      # 2026-02〜04 に習慣が途切れて 460 ハンクまで積み上がった。**人ではなく機構が持つ**
      # ことが本検査の目的であり、マシンが変わっても途切れないのはそのためである。
      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `save-if` で main からしか保存しない。**この job 単体の都合ではなく、Actions キャッシュの
      # 10GB 上限を共有しているからである**——保存を許すと PR ごとに 2573MB が
      # `refs/pull/*/merge` へ積まれ（実測）、e2e.yml が main スコープへ置く smoke 用の
      # エントリを LRU で押し出しうる。**押し出されても赤くならない**（restore-key で部分ヒットし、
      # ビルドが静かに元の所要へ戻る）ため、検出ではなく圧力そのものを断つ。
      #
      # 受容する残余: Cargo.lock を変える PR では、その PR の 2 回目以降の run も main の
      # エントリからしか復元できない。rust-check は debug ビルドで元々短く（実測 4m18s）、
      # 依存を動かす PR は稀（`/deps-update`）なので、常時かかる 10GB 圧力と釣り合わない。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (snotra-core)
        run: cargo test -p snotra-core

      - name: cargo test (snotra-egui-runtime)
        run: cargo test -p snotra-egui-runtime

      - name: cargo test (snotra)
        run: cargo test -p snotra

      - name: cargo test (snotra-settings)
        run: cargo test -p snotra-settings

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Pester の統合テストが、共有モジュールで作った seed を実際の製品が parse できることと、
      # Win32/DWM の窓矩形とキャプチャ寸法が一致することを検査する。
      - name: cargo build (PowerShell integration fixture)
        run: cargo build -p snotra

      # #562: docgen 検出器。doc コメント内の intra-doc link（散文内シンボル参照）の切れを
      # 機械検査する。deny 化は各 crate の `[lints] workspace = true`（Cargo.toml）経由で、
      # 既定 warn の素通りを塞ぐ。--document-private-items は private モジュールの //! link も
      # 検査対象にするため必須。src-tauri は windows 専用依存ゆえ ubuntu では build 不能＝
      # この windows ジョブで走らせる。
      - name: cargo doc (intra-doc link check)
        run: cargo doc --workspace --no-deps --document-private-items

      # #509: main 保護 Layer 1（.githooks）と PreToolUse/PostToolUse フック
      # （.claude/hooks）の selftest は、実運用が Windows でのみ起きるセーフティネット。
      # ubuntu の node-check と相補的に、Windows 固有の hook 実行機構
      # （Git-for-Windows の shebang 経由 sh 起動・パス/クォート境界）を検知する。
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run tests on Windows (vitest: .claude/hooks + .githooks + scripts)"
        run: npm test

      - name: "Run PowerShell tests (Pester)"
        run: npm run test:powershell
