name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build
        env:
          VITE_APP_VERSION: "ci-build"
          VITE_APP_BUILD_NUMBER: "ci"

  rust-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (snotra-core)
        run: cargo test -p snotra-core

      - name: cargo test (snotra)
        run: cargo test -p snotra

      - name: cargo test (snotra-settings)
        run: cargo test -p snotra-settings

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # #509: main 保護 Layer 1（.githooks）と PreToolUse/PostToolUse フック
      # （.claude/hooks）の selftest は、実運用が Windows でのみ起きる安全網。
      # ubuntu の frontend-check と相補的に、Windows 固有の hook 実行機構
      # （Git-for-Windows の shebang 経由 sh 起動・パス/クォート境界）を検知する。
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: "Run tests on Windows (vitest: ui + .claude/hooks + .githooks)"
        run: npm test
