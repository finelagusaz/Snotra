name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 旧 frontend-check の縮退（#532 SU7 PR3・フロント撤去）。残る npm test は
  # セーフティネット（.claude/hooks・.githooks・scripts）の vitest で、ubuntu 側は
  # 実行ビット・POSIX sh 厳密性を rust-check（windows）と相補的に担保する（#509）。
  node-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run tests (vitest: .claude/hooks + .githooks + scripts)"
        run: npm test

  # #587: ガバナンス文書の決定的検査。skip-ci ガードを意図的に付けない —
  # skip-safe と定義された変更（docs/rules/skills/*.md）こそが本検査の対象であり、
  # ガードを付けると Markdown-only PR が再び未検査に戻る。paths フィルタも付けない
  # （依存ゼロ・数秒で完了するため常時実行し、「走らなかった」経路を作らない）。
  governance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: governance check
        run: node scripts/governance-check.mjs

  rust-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (snotra-core)
        run: cargo test -p snotra-core

      - name: cargo test (snotra-egui-runtime)
        run: cargo test -p snotra-egui-runtime

      - name: cargo test (snotra-egui-mvp)
        run: cargo test -p snotra-egui-mvp

      - name: cargo test (snotra)
        run: cargo test -p snotra

      - name: cargo test (snotra-settings)
        run: cargo test -p snotra-settings

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # #562: docgen 検出器。doc コメント内の intra-doc link（散文内シンボル参照）の切れを
      # 機械検査する。deny 化は各 crate の `[lints] workspace = true`（Cargo.toml）経由で、
      # 既定 warn の素通りを塞ぐ。--document-private-items は private モジュールの //! link も
      # 検査対象にするため必須。src-tauri は windows 専用依存ゆえ ubuntu では build 不能＝
      # この windows ジョブで走らせる。
      - name: cargo doc (intra-doc link check)
        run: cargo doc --workspace --no-deps --document-private-items

      # #509: main 保護 Layer 1（.githooks）と PreToolUse/PostToolUse フック
      # （.claude/hooks）の selftest は、実運用が Windows でのみ起きるセーフティネット。
      # ubuntu の node-check と相補的に、Windows 固有の hook 実行機構
      # （Git-for-Windows の shebang 経由 sh 起動・パス/クォート境界）を検知する。
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run tests on Windows (vitest: .claude/hooks + .githooks + scripts)"
        run: npm test
