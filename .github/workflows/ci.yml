name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build
        env:
          VITE_APP_VERSION: "ci-build"
          VITE_APP_BUILD_NUMBER: "ci"

      # #562: TypeDoc の {@link} 検査。doc コメント相互参照の切れを機械検査する。
      # treatValidationWarningsAsErrors で warn を fail 化（typedoc.json）。emit:none ゆえ
      # 成果物は出さない。現状 {@link} は 0 件で純粋な将来ガード（cargo doc の TS 版）。
      - name: TypeDoc link check
        run: npm run docs:check

  # #587: ガバナンス文書の決定的検査。skip-ci ガードを意図的に付けない —
  # skip-safe と定義された変更（docs/rules/skills/*.md）こそが本検査の対象であり、
  # ガードを付けると Markdown-only PR が再び未検査に戻る。paths フィルタも付けない
  # （依存ゼロ・数秒で完了するため常時実行し、「走らなかった」経路を作らない）。
  governance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: governance check
        run: node scripts/governance-check.mjs

  rust-check:
    if: >-
      github.event_name == 'push' ||
      !contains(join(github.event.pull_request.labels.*.name, ','), 'skip-ci')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (snotra-core)
        run: cargo test -p snotra-core

      - name: cargo test (snotra)
        run: cargo test -p snotra

      - name: cargo test (snotra-settings)
        run: cargo test -p snotra-settings

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # #568: feature 限定の main() 配線（configure_e2e_webview の呼び出し）は
      # 既定 feature の check/clippy/test では cfg で除外され compile されない
      # （唯一 compile するのは e2e.yml の feature 付き tauri build）。feature 付き
      # clippy で compile + lint 被覆し、配線の破損を高速検査で loud に落とす。
      - name: cargo clippy (e2e-webview-automation feature)
        run: cargo clippy -p snotra --features e2e-webview-automation --all-targets -- -D warnings

      # #562: docgen 検出器。doc コメント内の intra-doc link（散文内シンボル参照）の切れを
      # 機械検査する。deny 化は各 crate の `[lints] workspace = true`（Cargo.toml）経由で、
      # 既定 warn の素通りを塞ぐ。--document-private-items は private モジュールの //! link も
      # 検査対象にするため必須。src-tauri は windows 専用依存ゆえ ubuntu では build 不能＝
      # この windows ジョブで走らせる。
      - name: cargo doc (intra-doc link check)
        run: cargo doc --workspace --no-deps --document-private-items

      # #509: main 保護 Layer 1（.githooks）と PreToolUse/PostToolUse フック
      # （.claude/hooks）の selftest は、実運用が Windows でのみ起きるセーフティネット。
      # ubuntu の frontend-check と相補的に、Windows 固有の hook 実行機構
      # （Git-for-Windows の shebang 経由 sh 起動・パス/クォート境界）を検知する。
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: "Run tests on Windows (vitest: ui + .claude/hooks + .githooks)"
        run: npm test
