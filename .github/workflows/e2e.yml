name: Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # paths が唯一の自動ゲート。カテゴリ C 相当（ウィンドウ生成・ホットキー・スラッシュコマンド）を
    # 含みうる変更、および依存 manifest/lockfile に触れた PR で自動起動する。
    # 手動実行は workflow_dispatch。拾いすぎ（配下 *.md 等）は過剰実行で安全側ゆえ negation を足さない。
    # WebView2 e2e（Playwright + tauri-driver）は #532 SU7 flip で撤去済み——後継は smoke-egui job
    # （egui 経路の自動回帰の最低線）+ 手動 GUI smoke 体制（docs/build-commands.md）。
    paths:
      - 'src-tauri/**'
      - '.github/workflows/e2e.yml'
      # workflow の各ステップが直接呼ぶスクリプト（変更で自己検証する）
      - 'scripts/smoke-startup.ps1'      # "Run startup smoke" ステップ
      - 'scripts/smoke-egui.ps1'         # "Run egui smoke" ステップ（#532 SU7）
      # 依存 manifest/lockfile（依存更新 PR を smoke 網に載せる）
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # egui 経路の自動回帰 smoke（#532 SU7・e2e/ 撤去後の後継の最低線）。
  # npm は smoke:egui の script wrapper（pwsh 起動）にのみ使う——フロント資産は
  # PR3 で撤去済みで、tauri codegen もフロント入力を要求しない（frontendDist なし）。
  smoke-egui:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build release binary
        run: cargo build --release -p snotra

      # flip 済み（#532 SU7 PR2）: env なし＝「既定が egui であること」自体が検証対象（spec 決定 3）。
      #
      # **startup smoke より前に置く**（#686）: `-SeedConfig` は config.toml **不在時のみ** seed する
      # 安全側の設計で、seed が成立しないと results 窓の被覆が自動 skip される。startup smoke は
      # アプリを 5 回起動して config.toml を作るため、後ろに置くと seed が毎回諦めて **job は緑の
      # まま results 被覆が消える**（#671 サイクルの 5 run すべてで実測）。
      #
      # この順序制約を守らせるのは規約ではなく `-RequireResults` である——skip を失敗に変えるので、
      # 将来ステップを入れ替えたら**赤くなって気づける**（順序だけ直しても再発は防げない）。
      - name: Run egui smoke
        run: npm run smoke:egui -- -ExePath target/release/snotra.exe -SeedConfig -RequireResults

      # 起動 trace に *:error が無いことの検証（旧 e2e job から移設・検証内容は同一）。
      # 上の egui smoke が seed した config.toml が既に在るため、ここでの 5 起動は first-run 経路を
      # 通らない（順序を入れ替える前は 1 回目が first-run だった）。first-run は本 job の検証対象
      # ではない（アサーションは「*:error が無いこと」だけ）ので、被覆の縮小として受容する。
      - name: Run startup smoke
        run: pwsh -NoProfile -File scripts/smoke-startup.ps1 -ExePath target/release/snotra.exe
