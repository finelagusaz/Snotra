name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          yaml-file: .github/labels.yml
          # labels.yml を唯一の真実源（SSOT）にする。ここに無いラベルは同期時に削除される。
          # 新しいラベルを使う前に必ず labels.yml へ定義を追加すること。
          # crazy-max は skip-delete 既定 false で SSOT 外ラベルを削除する
          # （EndBug の delete-other-labels: true と同一挙動）ため、明示指定しない。
          github-token: ${{ secrets.GITHUB_TOKEN }}
