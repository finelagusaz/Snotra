name: Pester Flake Repro

# **測定用の workflow であって、ゲートではない**（#872 / #936）。同一 runner 上で Pester を
# N 回繰り返し、12.5% の間欠失敗の標本を一度に集める。反復のうち何回落ちてもこの workflow は
# 緑で終わる——赤にする責務は `ci.yml` の `rust-check` が持つ。**ここの緑を「検査が通った」と
# 読んではならない**（判定の SSOT は `scripts/repro-pester-flake.ps1` の冒頭 doc）。
#
# 存在理由: 調査の律速は計器の解像度ではなく標本の採取速度だった。「たまたま落ちる PR」を
# 待つ形では 1 日 1 標本しか採れず、7 件を超える発生に対して機序が最後まで割れなかった。
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: '反復回数（1 反復あたり概ね 30〜60 秒）'
        required: false
        default: '30'
      failure_grace_ms:
        description: '失敗時に本体を kill する前に待つ ms（0 = 現行の挙動。遅着と喪失を分ける実験）'
        required: false
        # **既定で猶予を入れる**——この workflow の目的は測ることであり、「予算後に届いたのか
        # 恒久的に届かなかったのか」を分けない標本は情報が半分になる。失敗した反復にだけ
        # 15 秒足す（成功した反復の所要は変わらない）。`ci.yml` の rust-check は env を
        # 渡さないので、ゲート側の挙動には一切影響しない。
        default: '15000'
      max_minutes:
        description: '打ち切りまでの上限（分）'
        required: false
        default: '90'
  # **push でも起動する**——`workflow_dispatch` は既定ブランチに在るものしか起動できないため、
  # main へ入る前にこの workflow 自身を実測する経路がこれしかない（セーフティネットは
  # 「効いていることを一度は実測する」が規則・`.claude/rules/safety-nets.md`）。
  # 走るのは実験用の枝だけで、通常の feature ブランチには波及しない。
  push:
    branches:
      - 'chore/pester-flake-**'
      - 'exp/pester-flake-**'

# **cancel-in-progress を立てない**。標本の採取が途中で捨てられると、集めた反復ごと失う。
concurrency:
  group: pester-flake-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repro:
    runs-on: windows-latest
    # 反復 × 1 分に、ビルドと Pester 取得の分を足した上限。スクリプト側の -MaxMinutes が
    # 先に打ち切って集計を残すので、こちらは最後の安全弁である。
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # **debug ビルドである**——`rust-check` の Pester が使うのと同じプロファイルでなければ
      # 標本にならない（#890 で判明したコンソール窓は debug 固有だった）。
      - name: cargo build (Pester integration fixture)
        run: cargo build -p snotra

      - name: Repeat Pester suite
        run: >-
          pwsh -NoProfile -File scripts/repro-pester-flake.ps1
          -Iterations ${{ github.event.inputs.iterations || '30' }}
          -MaxMinutes ${{ github.event.inputs.max_minutes || '90' }}
          -FailureGraceMs ${{ github.event.inputs.failure_grace_ms || '15000' }}

      # **成功した反復の証拠も上げる**（対照群）。失敗時のダンプしか残らない現状では、
      # fail の所要が異常なのか平常なのかを比べられない。
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-flake-repro-${{ github.run_id }}
          path: target/pester-flake-repro
          if-no-files-found: error
          retention-days: 14
