name: Build Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag name (例: v0.12.0-alpha7)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag }}

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Get Build Date
        id: date
        run: echo "BUILD_DATE=$(Get-Date -Format 'yyyyMMddHHmm')" >> $env:GITHUB_ENV

      - name: Set version from tag
        run: |
          $ver = "${{ env.TAG_NAME }}".TrimStart('v')
          ./scripts/inject-version.ps1 -Version $ver

      - name: Build snotra-settings (release)
        run: cargo build --release -p snotra-settings
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}

      - name: Copy snotra-settings to binaries/ for NSIS bundling
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item target/release/snotra-settings.exe src-tauri/binaries/snotra-settings-x86_64-pc-windows-msvc.exe -Force

      - name: Build Windows executable and NSIS installer (release)
        run: npx tauri build --bundles nsis
        env:
          VITE_APP_VERSION: ${{ env.TAG_NAME }}
          VITE_APP_BUILD_NUMBER: ${{ env.BUILD_DATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify release artifacts
        run: |
          @("target/release/snotra.exe", "target/release/snotra-settings.exe") | ForEach-Object {
            if (!(Test-Path $_)) { Write-Error "$_ not found"; exit 1 }
          }
          $nsis = Get-Item "target/release/bundle/nsis/Snotra_*_x64-setup.exe" -ErrorAction SilentlyContinue
          if (!$nsis) { Write-Error "NSIS installer not found"; exit 1 }
          if (!(Test-Path "$($nsis.FullName).sig")) { Write-Error "NSIS .sig not found"; exit 1 }

      # 成果物の存在検証だけでは実際の起動可否は保証されない。e2e.yml の "Run startup smoke" ステップが
      # release バイナリに対して行っている起動スモークと同じスクリプトを、ビルド済み
      # exe（NSIS インストーラーではなく target/release/snotra.exe）に対して実行し、
      # アップロード前に起動失敗を検知するゲートとする。
      - name: Run startup smoke on release binary
        run: pwsh -NoProfile -File scripts/smoke-startup.ps1 -ExePath target/release/snotra.exe

      - name: Package as ZIP (portable)
        run: |
          Compress-Archive -Path "target/release/snotra.exe","target/release/snotra-settings.exe" -DestinationPath "Snotra-${{ env.TAG_NAME }}.zip"

      - name: Generate latest.json (updater endpoint)
        run: |
          $ver = "${{ env.TAG_NAME }}".TrimStart('v')
          $nsis = Get-Item "target/release/bundle/nsis/Snotra_*_x64-setup.exe" | Select-Object -First 1
          $sig  = (Get-Content "$($nsis.FullName).sig" -Raw -Encoding utf8).Trim()
          $url  = "https://github.com/finelagusaz/Snotra/releases/download/${{ env.TAG_NAME }}/$($nsis.Name)"
          $json = [ordered]@{
            version   = $ver
            notes     = ""
            pub_date  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = $url
              }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

      - name: Detect prerelease
        id: meta
        shell: bash
        run: |
          if [[ "${{ env.TAG_NAME }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          # draft を維持する: create-release.yml は draft: true で下書きを作るが、
          # このアップロードで draft 指定を省くと softprops の既定 (draft=false) に
          # 上書きされ、署名済み成果物が即時公開されてしまう。署名を人手で検証して
          # から手動 publish する検証ゲートを残すため、ここで明示的に draft: true を指定する。
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            Snotra-${{ env.TAG_NAME }}.zip
            target/release/bundle/nsis/Snotra_*_x64-setup.exe
            latest.json
