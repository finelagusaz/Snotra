name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Get Build Date
        id: date
        run: echo "BUILD_DATE=$(Get-Date -Format 'yyyyMMddHHmm')" >> $env:GITHUB_ENV

      - name: Set version from tag
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content Cargo.toml -Raw -Encoding utf8) `
            -replace '(?m)^version = "[\d.]+"', "version = `"$ver`"" |
            Set-Content Cargo.toml -Encoding utf8 -NoNewline

      - name: Build Windows executable (release)
        run: npx tauri build --no-bundle
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_APP_BUILD_NUMBER: ${{ env.BUILD_DATE }}

      - name: Build snotra-settings (release)
        run: cargo build --release -p snotra-settings
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}

      - name: Verify release artifacts
        run: |
          @("target/release/snotra.exe", "target/release/snotra-settings.exe") | ForEach-Object {
            if (!(Test-Path $_)) { Write-Error "$_ not found"; exit 1 }
          }

      - name: Package as ZIP
        run: |
          Compress-Archive -Path "target/release/snotra.exe","target/release/snotra-settings.exe" -DestinationPath "Snotra-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Snotra-${{ github.ref_name }}.zip
