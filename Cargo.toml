[workspace]
members = [
    "snotra-core",
    "snotra-egui-runtime",
    "src-tauri",
    "snotra-settings",
]
resolver = "2"

[workspace.dependencies]
egui = "=0.35.0"
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"

[workspace.package]
version = "0.1.0"

# docgen 検出器（#562）: 散文内シンボル参照（intra-doc link）の切れを cargo doc で機械検査する。
# warn 既定では CI が素通りするため deny 化。各 crate は `[lints] workspace = true` で opt-in。
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
# `private_intra_doc_links` は「フラグ無しで建てた doc では private 項目が出ないので link が
# 死ぬ」という警告だが、このリポジトリの doc 建ては `ci.yml` の
# `cargo doc --workspace --no-deps --document-private-items` 固定であり、private への link は
# 実際に解決する（crate は publish せず docs.rs 建ても無いので、フラグ無しで建てる消費者は居ない）。
# **この allow はリンク切れの検査を弱めない**——存在しないシンボルへの link は
# 上の `broken_intra_doc_links = "deny"` が引き続き deny で捕まえる（変異注入で実測）。
# **撤去条件: どれかの crate を publish する、または docs.rs へ doc を建てる方針が出たら、この行を外す。**
# そのとき doc はフラグ無しでも建つので、上に書いた前提（`--document-private-items` 固定）が崩れる
# ——private への link は本当に死に、この警告は正しい指摘へ変わる。
private_intra_doc_links = "allow"

# `src-tauri/clippy.toml` の禁止（#900）を、コマンドラインから独立させる（#950）。
# `disallowed_methods` は **warn 既定**であり、この行が無いと赤くなるのは `ci.yml` と
# `.claude/hooks/post-edit.mjs` が `-D warnings` を渡している間だけで、どちらかがそれを落とせば
# 禁止は黙って助言へ降格する。`clippy.toml` を持たない 3 crate は禁止集合が空ゆえ無害
# （`-D warnings` 無しで exit 0・診断なしを実測）。
# **この節へ `all = "allow"` のような群の allow を足すと、deny の行を残したまま禁止が消える**
# （実測: exit 0・診断 0 件）。群を allow にしたいなら `priority = -1` で先に当てること。
# この節の消失・降格と、`all` / `style` の allow による打ち消しは G-clippy-disallowed が捕まえる
# （上流 clippy が 3 つ目の群へ disallowed_methods を入れたら、その群は見張られない）。
[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.release.package.snotra-settings]
opt-level = "s"

[profile.release.package.snotra]
opt-level = "s"
