# rust-analyzer のワークスペース設定。VS Code もこのファイルを読む。
#
# **ここに書けるのは workspace 水準と local 水準のキーである。** rust-analyzer は設定を 4 水準
# （global / local / workspace / client）に分けており、リポジトリ直下の `rust-analyzer.toml` は
# そのうち **2 枝**を運ぶ——`RatomlFile::Workspace` が抱えるのが
# `WorkspaceLocalConfigInput { workspace, local }` で、local の解決器も source root を遡りながら
# `RatomlFile::Workspace(config) => config.local.<key>` を読むためである。ゆえに `diagnostics.*`
# のような local 水準のキーもここで設定できる。一方 `files.exclude` / `hover.*` /
# `cachePriming.enable` / `lru.capacity` は global 水準なので、ここへ書いても**沈黙で無視される**。
# （出典: rustc 1.97.1 に同梱の rust-analyzer の `crates/rust-analyzer/src/config.rs`。
#   `config_data!` の各ブロックが水準の正本で、解決順は下の注記のとおり）
#
# **2026-08-14 に「workspace 水準だけ」から訂正した。** global が無視されることの実測から
# 「workspace 以外は入らない」を導いてしまった全称表現で、local には当たっていなかった。
#
# **workspace 水準の解決順は「このファイル → クライアント設定 → ユーザ ratoml → 既定」**、
# **local 水準は「source root を遡る ratoml 群 → クライアント設定 → ユーザ ratoml → 既定」**。
# つまりここに書いた値は `.vscode/settings.json` を**上書きする**。ゆえに VS Code を軽く
# 保つための調整（`cargo.allTargets` / `check.allTargets`）はここに書かない——書けば
# VS Code 側からは戻せなくなる。重い設定は下のコメントアウト群として残してある。
#
# **反映は再起動時のみ**（2026-08-13 実測: 稼働中のサーバは書き換えを拾わなかった）。
# 効いているかの検算: セッション再起動後に workspaceSymbol へ 1 文字クエリ（例 `e`）を投げ、
# **128 件を超える**か、結果に Function が混ざれば効いている（既定は limit=128 / only_types）。

# シンボル検索を型だけに絞らず、上限で黙って切らない。
# 既定の `only_types` は「型で 1 件も当たらなかったときだけ全シンボルへ落ちる」挙動なので、
# 広いクエリでは関数が一切見えない。既定の limit=128 も、網羅性が要件の作業では沈黙の打ち切りになる。
[workspace.symbol.search]
kind = "all_symbols"
limit = 512

# rust-analyzer 専用の target ディレクトリ（`target/rust-analyzer/`）。
# rust-analyzer の `cargo check` と build script 実行が `target/` のロックを掴まなくなるので、
# PostToolUse hook の `cargo fmt/clippy/test` と食い合わない。
#
# 代償の「成果物の二重化」は 2〜2.5 GB 程度である（2026-08-13 実測）。複製されるのは check
# 成果物——`.rmeta` 1,853 MiB / 1,508 個と build script 出力 367 MB——だけで、リンク済み
# バイナリ（`snotra.exe` 33 MB / `.pdb` 244 MB）は入らない。`target/` 全体は 9.9 GB。
#
# **`target/rust-analyzer/` の有無はこの設定の効果を判定しない**（2026-08-14 に訂正・#1083）。
# このディレクトリは rust-analyzer の `cargo check` だけでなく build script / proc-macro の
# ビルドでも使われるので、**育っても**「RA 由来の Cargo work が在った」までしか言えない。
#
# **実測（2026-08-14）**: flycheck は実際に走っている——`target/flycheck0/stdout` が
# `cargo check --message-format=json` の生出力である。ところがその artifact のパスは
# `target/debug/` を指しており、`target/rust-analyzer/` は不在だった。**この設定は Claude Code の
# rust-analyzer には効いていない。** 同じことが上の `[workspace.symbol.search]` にも当たる
# （`workspaceSymbol("config")` が Struct / Enum だけを返し、既定の `only_types` のままだった）。
# **独立な 2 キーの不発ゆえ、このファイルが Claude Code の RA へ届いていないと読める。機序は未確定。**
#
# **判定の手段はディレクトリの有無ではなく挙動プローブである**: `workspaceSymbol` に Function が
# 混ざるか、`.rs` の編集後に `target/flycheck0/stdout` の mtime が動くか。
#
# **`checkOnSave` を切ってもこのキーの価値は残る**——build script / proc-macro のビルドを通常の
# `target/` から分離し、ロックの食い合いを避けるのは check とは独立した効能である。
[cargo]
targetDir = true

# --- 以下は入れない側。VS Code も同じファイルを読み、しかもここが優先される ---

# **`checkOnSave` と `diagnostics.*` をここへ書いてはならない。** どちらも workspace / local 水準で
# 「このファイル → クライアント設定」の順に解決されるため、Claude Code 用の LSP plugin
# （`.claude/lsp/`）が `initializationOptions` で渡している値を**黙って上書きする**。しかも同じ値が
# VS Code 側にも掛かり、クライアントごとに非対称な設定を作るという目的そのものが崩れる。
# この禁止は `.claude/hooks/lsp-config.mjs` のカナリアが機械で縛っている（#1083）。

# 必須 lint（`cargo clippy --workspace --all-targets -- -D warnings`）を保存時に走らせる。
# エージェント側には不要——PostToolUse hook が編集ごとに同じものを既に走らせている。
# [check]
# command = "clippy"
# extraArgs = ["--", "-D", "warnings"]
