# このリポジトリが使う Rust の版。**ローカルと CI の両方をここ 1 か所が決める**（#1161）。
#
# 固定する理由: `ci.yml` は `dtolnay/rust-toolchain@stable` を使うため、固定しないと
# **リポジトリが 1 行も変わらなくても外界の toolchain 更新で赤くなる**。2026-08-21 に実際に
# 起きた——1.98 で新設された `clippy::chunks_exact_to_as_chunks` が既存コード 4 箇所を赤にし、
# `.rs` を 1 行も含まない PR がそれを踏んだ（#1160 で修正）。
#
# **固定は「気づかなくなる」向きの変更でもある。** 固定しなければ CI の赤が更新を報せるが、
# 固定するとその合図が消える。代わりの契機は `/deps-update` に置いた——新しい機構は足していない
# （`AGENTS.md`「条件別チェック（トリガー → 参照先）」のガバナンス機構の行が言う「気づく契機が
# 残るなら、機構ではなく引き金で足りる」）。
#
# **更新はこのファイルの `channel` 1 行を変えるだけでよい。** rustup がローカルでも CI でも
# これを読んで override し、未インストールなら自動で取得する（2026-08-21 実測:
# `rustup show active-toolchain` が override の出所としてこのファイルを名指す）。
#
# **`components` をここに書くのは `ci.yml` の component 明示（#858 / #859）と同じ要求である。**
# あちらが警告するのは「runner イメージのプリインストールに暗黙依存すると、消えた日に初めて
# 壊れる」ことで、その要求の宛先が override するこちらへ移った。実測でも、この行が rustfmt の
# 自動ダウンロードを起こした。
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
