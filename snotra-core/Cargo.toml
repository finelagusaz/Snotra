[package]
name = "snotra-core"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
toml = "1"
nucleo-matcher = "0.3"
rayon = "1"
dirs = "6"
rustc-hash = "2.1.1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
