[package]
name = "snotra-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
bincode = "1"  # 旧形式マイグレーション読み込み用
toml = "0.8"
nucleo-matcher = "0.3"
dirs = "6"
rustc-hash = "2.1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
