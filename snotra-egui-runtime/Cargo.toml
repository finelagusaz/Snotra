[package]
name = "snotra-egui-runtime"
version.workspace = true
edition = "2024"
publish = false

# docgen 検出器（#562）の opt-in。他 3 crate は当初から持っており、当 crate だけが
# 漏れていた（#701）——ルート [workspace.lints.rustdoc] の deny がここで初めて効く。
[lints]
workspace = true

[dependencies]
arboard = "3"
egui.workspace = true
log = "0.4"
softbuffer = { version = "=0.4.8", default-features = false }
tauri.workspace = true
tauri-runtime.workspace = true
tauri-runtime-wry.workspace = true
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
