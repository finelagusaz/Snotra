[package]
name = "snotra"
version.workspace = true
edition = "2024"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
snotra-core = { path = "../snotra-core" }
snotra-egui-runtime = { path = "../snotra-egui-runtime" }
egui.workspace = true # SearchWindowView が EguiView を実装するため（runtime と同一 egui インスタンスに解決）
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
fontdb = "0.23"
# cmap 実測で user_font が CJK をカバーするかを判定する（jp_font fallback の要否）。
# fontdb が内部で使う版と同一ゆえ、直接依存にしてもビルドツリーは増えない。
ttf-parser = "0.25"
rayon = "1"
notify = "8"
arboard = "3"
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
] }

# **kittest はテスト専用である**（#872）。`view.rs` の `search_input_ui` を実コードのまま
# 走らせ、キャレット・focus・`TextEdit` 構築の**並び**を縛る。#938 が入れた単体検査は egui の
# 意味論だけを固定し、`update()` の並びが後ろへ戻っても通る受容残余を持っていた。
# 版は `egui = "=0.36.1"` に合わせる（`snotra-settings/Cargo.toml` と同じ指定）。
[dev-dependencies]
egui_kittest = { version = "0.36", default-features = false }
