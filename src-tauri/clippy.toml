# この crate で禁じるメソッドの集合。**関心は 1 つではない**——配列は群ごとにコメントで区切る。
# 群を足すときは `scripts/governance/checks/G-clippy-disallowed.mjs` の `REQUIRED_DISALLOWED_METHODS` へも登録すること
# （**登録しないパスの書き損じは沈黙する**。理由は下の「この設定が死ぬ経路」の 1・2）。
# **上の行の宛先が腐っても機構は鳴らない**——`.toml` は `governanceDocs()` の母集団外ゆえ
# G-references はこのパスを照合しない（#1094 で実際に facade を指したまま腐った）。人が直す。
#
# ## 群 1: `Context` 経由で global style を書く 7 メソッド（#751 / #900）
#
# root `Ui` は pass 冒頭で `ctx.global_style()` を `Arc<Style>` として掴む。ゆえに run_ui の
# callback 内からの書き込みは**その pass に届かず**、色だけを変えた config 適用フレーム
# （＝次フレームが来る保証の無い状況）で入力欄だけが旧色で残る。修正は PR #901（7562cef。
# squash subject が #751 を含まないので `git log --grep` では辿れない）、却下した代替案は
# ADR-visuals-application-target（このファイルからの参照は governance:check の走査元に入らないため、
# パス形で書いても保護されない。改名しない slug 名で指す）。
#
# 含めなかったもの:
#   - `style_ui` / `settings_ui` — 内部で書き込み口を呼ぶが、これらは egui 組み込みのスタイル
#     編集パネルを**描くウィジェット API** である。呼ぶ人は inspector を出したいのであって #751 の
#     誤りを犯していない。禁止すると偽陽性になり、解消手段が `#[allow]` しか残らない——機構を
#     完全に無効化する逃げ道を、正当な理由で打鍵させることになる。
#   - `options_mut` / `memory_mut` — 汎用アクセサ。どちらも `Options` の `dark_style` /
#     `light_style`（どちらも pub）へ直接書けるので、**これがこの機構の穴である**（受容残余）。
#     `memory_mut` は focus 操作の実使用があり禁止できない。
#   - `set_debug_on_hover` — `all_styles_mut` を呼ぶが、クロージャが egui 内部で `style.debug` へ
#     固定されており visuals を書けない。
#   - `set_fonts` / `add_font` — style ではなくフォント定義。`font_stack.rs` に正当な実使用がある。
#   - `set_theme` — 書くのは `theme_preference` であって style の中身ではない。この crate は config の
#     hex 色から直接 `Visuals` を作るので使わない。ただし run_ui 内で呼べば「当該 pass に届かない」
#     症状は同型に出る（1 フレーム遅れて切り替わる）。
#
# **この禁止は crate 全体に掛かるので、欠陥を持たない地点も塞ぐ。** `EguiView::setup` は
# `EguiWindow::new` から run_ui の**外**で呼ばれるため、そこでの global style 書き込みは第 1 pass から
# 効く（＝ #751 の欠陥を持たない）。**#900 の時点では**そこに style 書き込みが一度も無かったので塞ぐ
# 判断を採ったが、必要になったら `#[allow(clippy::disallowed_methods)]` + 理由コメントで開けること——
# **それがこの群で sanctioned な解消手段である**（実例は `view.rs` の `apply_exact_hit_test_style`
# ——#1043 で 2026-08-11 に `setup` へ入った。**#951 の禁止判断（2026-08-06）より後である**）。
# **群ごとに違う**——群 3 は `#[expect]` を要求する（理由は同群のコメント）。
# **群 2 には解消手段を定めていない**——製品に正当な使用が生じない設計だからであり（下の群 2 の
# コメント）、必要になった時点でそれ自体を設計判断として扱う。
#
# **この設定が死ぬ経路と、いま誰が見ているか**（いずれも 2026-08-06 に実測）:
#   0. この lint は **warn 既定**である（`clippy-driver -W help` で実測）。**ルート `Cargo.toml` の
#      `[workspace.lints.clippy]` が deny 化しているので、`-D warnings` には依存しない**（#950。それ以前は
#      `ci.yml` と `.claude/hooks/post-edit.mjs` がそれを渡している間だけ赤くなった）。その deny が消える・
#      warn へ降格する・**同じ節の `all = "allow"` に打ち消される**（deny の行を残したまま禁止が消える）の
#      3 経路は `npm run governance:check` の G-clippy-disallowed が見張る
#   1. メソッド名・型名の書き損じ → warning は出るが `-D warnings` でも exit 0 → **G-clippy-disallowed**
#   2. crate 名の書き損じ・egui 依存の消滅 → 診断そのものが出ない → **G-clippy-disallowed**
#      （ファイルの削除・空配列化・エントリ 1 行の消失・配列内でのコメントアウトも同じ検査が捕まえる）
#   3. このファイルは cargo の fingerprint に入らない → ここだけを変えて同じコマンドを打つと、
#      キャッシュ replay で設定を適用せずに exit 0 を返す（`.rs` を触るか `cargo clean -p snotra` を挟む）。
#      **これは誰も見ていない残余である**。
#      **2026-08-18（clippy 0.1.97）に、この経路は再現しなかった**——`cargo clippy` が exit 0 を返した
#      直後にこのファイルだけを編集して同じコマンドを打つと、`.rs` を触らず `cargo clean` も挟まずに
#      診断が現れた。**機序は測っていない**（上流が追随するようになったのか別の要因かは不明）ので、
#      上の手順は安全側の上位集合としてそのまま残す。#1122 の計測はいずれも `.rs` を touch している。
#   PostToolUse hook は exit code でしか検出しないため、1・2 の warning は会話にも届かない——
#   だから検知を clippy の外（Node の静的読み取り）へ置いた。
#   **パスを足す・変えるときは、その場で違反を注入して赤くなることを必ず測ること**——
#   G-clippy-disallowed が見るのは `REQUIRED_DISALLOWED_METHODS` が名指す件の在否であって、
#   **そのパスが解決することは見ない**。**数を書かない**——群を足すたびにこの行だけが腐る。
#
# ## 群 2: 計測ハーネス専用の観測口（#1067）
#
# `Engine::sorted_by_path` は索引が `target_path` のバイト順に並んでいるかを返す。**計器が
# 「速い経路と遅い経路のどちらを測ったか」を出力に添えるため**に在り、製品がこれを読んで
# 分岐してはならない——分岐は `PathStore::cmp_paths` の内側に閉じている。`#[doc(hidden)]` は
# 意図を示すだけで呼び出しを止めないので、製品 crate だけを機構で塞ぐ。
#
# **統合テスト（`snotra-core/tests/`）は別 crate ゆえ無影響である**——計器はそちらに在る。
# **`sorted_prefix_len` は禁じていない**——`#[cfg(test)]` で閉じてあり、製品からは**呼べない**
# （禁止を足すより公開面を減らすほうが強い）。`SearchEngine` 側の同名 2 メソッドも `pub(crate)` で、
# **製品 crate から届く綴りは `Engine::sorted_by_path` の 1 本だけである。**
#
# **egui のピンを動かしたら、この表を注入で測り直すこと。** 上流の API 変更でパスが解決しなく
# なっても、上の 2 番の形で黙る（型エラーにも警告にもならない）。ピンはルート `Cargo.toml`。
#
# **`Cargo.toml` へ移せるのはレベルだけで、内容は移せない**——`disallowed-methods`（禁止集合）は lint の
# レベルではなく**設定値**であり、`clippy.toml`（または `CLIPPY_CONF_DIR`）が唯一の口である。
# `[workspace.lints]` は全 member 共通ゆえ、禁止集合をそこへ置けば `snotra-settings` の正当な使用を
# 巻き込む——crate ごとに分けたいという要件そのものが workspace lints と反対を向いている。
# **一方でレベル（deny）は移した**（#950）: 禁止集合を持たない 3 crate では集合が空で無害であり
# （`-D warnings` 無しで exit 0・診断なしを実測）、上の経路 0 が消えるからである。
# **この段は全群に掛かる**（群 2 固有の話ではない）。
#
# ## 群 3: engine 錠越しの config の live-read（#1032 / #1076 / #1122）
#
# **守る命題**: この群が実効なら、`engine.lock().config()` の形の live-read は src-tauri の clippy で
# error として落ちる。検索 worker は `engine.search` の間じゅう `Mutex<Engine>` を握る（実運用点で
# 40〜95 ms）ため、UI がその錠越しに設定を読むとフレームが走査の完了まで返らない。**規範の全文と
# 例外の弁別子は `src-tauri/CLAUDE.md`「モジュール構成」の当該条項が正本である**（ここに言い換えを
# 置かない）。却下した弁別子と、型で表せない理由は ADR-config-read-exception-discriminator。
#
# **型では表せないので lint にした**——弁別子が否定形の述語（「イベントループスレッドを止め**ない**
# 場所での読み」）であり、この crate 群が持つ証人型 `EventLoopProof` は肯定側の存在を証明できても
# 不在を証明できない（同 ADR 案 G）。
#
# **例外は `#[expect(clippy::disallowed_methods, reason = …)]` で開ける。`#[allow]` を使わないこと。**
# 条項は既に「どこで走るかは呼び出し元を辿って決めること」という**呼び出し点ごとの判定義務**を課して
# いる。注釈はその判定結果をその場に残すものであって、義務を新設しない——**ここが群 1 で `style_ui` を
# 禁止しなかった判断との差である**（あちらの呼び手は何も判定する義務を負っていないので、注釈は純粋な
# 雑音になる）。**`#[expect]` を選ぶのは記録を load-bearing にするためである**: 違反が消えれば
# `unfulfilled_lint_expectations` が鳴るので、読みを `read_config` へ移したときに古い注釈を残せない。
# **分類は各 `#[expect]` の reason に書く**——下の配列側の reason は代替手段を指すだけに留める
# （パスごとに 1 つしか書けず、呼び出し点ごとの分類を運べない）。
#
# 含めなかったもの:
#   - `Engine::config_handle` — 返すのは `Arc` であって値ではなく、`AppState` の構築がこれを通る。
#     禁止すると構築そのものが不能になる。**ただし `engine.lock()` 越しに取り直せば同じだけ待つ**
#     ——それは下の残余である。
#   - `AppState.config` 経由の読み（`egui_shell::read_config`）— engine の錠を経ないので、そもそも
#     規範が**求めている**形である。
#
# **規範は機構より広い**（受容する残余）:
#   - 機構が見るのは `Engine::config` への参照であって害ではない。**メソッド呼びの形だけではない**
#     ——`let f = Engine::config;` のパス式も捕まることを 2026-08-18 に実測した（捕まらない形が
#     他に無いことは測っていない）。`Engine` の内側で config を読む他のメソッド（`search` /
#     `recent_history` / `begin_index_drain` 等）をイベントループから `engine.lock()` 越しに
#     呼べば同じ待ちが同じだけ乗るのに、診断は出ない。
#   - **記録した分類は黙って腐る。** 条項は「同じ関数が両方から呼ばれるようになれば分類は変わる」と
#     要求するが、注釈を持つ関数へイベントループ側から新しい呼び出し元が増えても何も鳴らない。
#     判定の責務は条項が読者に置いたままである。
#   - **`#[expect]` の不履行検知は `-D warnings` に依存する。** `unfulfilled_lint_expectations` は
#     warn 既定で、ルート `Cargo.toml` へ `[workspace.lints.rust]` を新設しない判断を採ったため、
#     赤くなるのは `ci.yml` と `.claude/hooks/post-edit.mjs` がそれを渡している間だけである。
#     **`cargo check` では診断そのものが評価されない**（rustc は `clippy::` ツール lint の
#     expectation を見ない・実測）。禁止そのものが #950 で得た「コマンドラインからの独立」（上の
#     経路 0）を、この足は持たない。
#
# **実測**（2026-08-18・rustc 1.97.1 / clippy 0.1.97。足場はすべて撤去済み）: 注釈なしで禁止を
# 入れると当該地点が error（`-D warnings` 無しでも error＝経路 0 の deny がこの群にも効く）/ 注釈を
# 付けると exit 0 / **禁止行を消すと注釈側が unfulfilled で赤** / **パスを書き損じても同じく赤**——
# `does not refer to a reachable function` はそれ自体 exit 0（上の経路 1）だが、注釈がそれを赤へ
# 変える。**G-clippy-disallowed が「緑は含意しない」と自ら宣言する前提（名指したパスが解決し
# 続けること）は、この群についてはここで閉じている。ただし閉じているのは、注釈を持つ地点が
# 1 つ以上残る間だけである**——例外がすべて `read_config` へ移れば注釈も（不履行に追われて）
# 消えるので、この群は群 1・2 と同じ沈黙へ戻る。**規範が成功した瞬間に計器が黙る形であり、
# 改善の向きにも嘘をつく**（黙る経路はもう 1 つ、上の `-D warnings` の残余である）。
# **もう 1 つ、注釈が覆う範囲に同じ lint の別の違反が無いことにも依る**——`#[expect]` は射程内の
# 診断 1 件で充足するので、他の禁止メソッドを同じ文に含めると腐りが隠れる。**文段への配置
# （関数段にしない）が、その条件をここでは構造的に保っている。** `cargo check` / `cargo test` /
# `cargo doc` / `cargo fmt --check` はいずれも壊れない。
disallowed-methods = [
    { path = "egui::Context::set_visuals", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    { path = "egui::Context::set_visuals_of", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    { path = "egui::Context::style_mut_of", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    { path = "egui::Context::set_style_of", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    { path = "egui::Context::global_style_mut", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    { path = "egui::Context::set_global_style", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    { path = "egui::Context::all_styles_mut", reason = "root Ui が pass 冒頭で掴む Arc<Style> に間に合わない（#751）。run_ui の中では ui.visuals_mut() を使う" },
    # --- ここから下は #751 とは別の関心である（上の群は egui の global style・こちらは計測用の観測口） ---
    { path = "snotra_core::engine::Engine::sorted_by_path", reason = "計測ハーネス専用の観測口であり、製品はこれを読んで分岐してはならない（#1067）。索引が整列しているかで振る舞いを変えたいなら、分岐は PathStore::cmp_paths の内側に閉じる" },
    # --- ここから下は上の 2 群とも別の関心である（engine 錠の待ちがフレームに乗ること） ---
    { path = "snotra_core::engine::Engine::config", reason = "engine 錠越しの config の live-read はフレームを検索の完了まで止める。UI からは egui_shell::read_config を通すこと。例外は expect 属性に分類理由を添えて開ける（正本は src-tauri/CLAUDE.md「モジュール構成」の当該条項・#1032 / #1076）" },
]
